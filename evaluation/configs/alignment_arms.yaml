# ---------------------------------------------------------------------------
# MODEL-FREE FLOORS (§5.1). No VLM call, no GPU, no replica.
#
# WHY THEY ARE HERE AND NOT ONLY IN `alignment_contrasts.yaml:external_arms`.
# Three consumers disagreed about where a floor is declared, and the study has an
# established answer already: `arms.yaml` declares its four model-free arms
# (`ref_single`, `ref_uniform_true`, `ref_uniform_modal`, `ref_script_prior`) as
# ordinary `arms:` entries carrying `tool: reference`, even though
# `reference_arms.py` and not `run_arm.py` produces them. The floors are that
# same case, so they are declared the same way.
#
# `tool: reference` is what keeps the launcher off them, and it is load-bearing
# rather than decorative: `run_all.sh:arms_matching` filters `tool != reference`,
# `preflight.check_grid` skips them (no upstream counterpart is derived), and
# `preflight.check_arm_flags` skips them (there is no config class to round-trip
# a flag against). None of those three needed changing to accept these rows.
#
# The alternative -- leaving them only in the contrast table's `external_arms` --
# cannot describe `floor_median_ratio`, which no §8 contrast references and which
# therefore has no row in a file keyed by contrast. It is still produced, still
# scored, and still appears in the per-arm descriptive table, so a reader sees a
# number whose supervision level is recorded nowhere. `external_arms` is kept as
# the redundant contract it says it is: `aggregate.py` refuses to run when the
# two files disagree on `tool` or `supervision`, and `align_floors.py`
# --arm-tables reconciles both against the metadata the floors actually emit.
#
# `equalised: true` is correct and not a waiver. The D12 gate asks whether two
# arms differ on a dimension the contrast did not declare; contrasts 7 and 8
# declare `dimension: tool`, which is exactly the VLM-versus-template difference
# these rows exist to represent. A floor sees no camera at all, so it cannot be
# unequalised on the camera axis the flag was introduced for.
- name: floor_uniform
  tool: reference
  supervision: labels_only
  uses_video: false
  equalised: true
  source: align_floors.py
  description: '|L| equal parts of the episode, anchored at the EPISODE START and not at t=0.
    Baseline of contrast 8 (claim A5): does looking at the video beat splitting the episode into
    equal parts? The anchor is the whole point -- evaluate_alignment measures every boundary
    error from ground_truth[0]["start"] while reference_arms._equal_split anchors at zero, and
    where those differ the floor carries a constant per-component bias that would read as VLM
    superiority (§5.1). One Corpus A episode is affected (u850-bag-place-02-FV-v30 episode 24
    starts at 0.563s), which is small, silent, and 0.563s against a b_hit@1 tolerance of 1s.'
