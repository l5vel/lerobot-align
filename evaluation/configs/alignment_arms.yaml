# Study 2 arms: FIXED-LABEL SUBTASK ALIGNMENT.
#
# The caller supplies an ordered label list L and the VLM decides only WHEN each
# label happens. See alignment_plan.md §4 for the task and §5.2 for this table.
#
# WHY A SECOND ARMS FILE. `arms.yaml` contains zero fixed-label arms -- every arm
# there lets the model invent its own labels -- so `run_arm.py` exits
# "unknown arm" on the first alignment job (alignment_plan.md §10.2, the largest
# omission from that plan's first draft). This file is that study's grid. It is
# deliberately a separate file rather than more rows in `arms.yaml`: the two
# studies score different predictions with different metrics under different
# contrast families, and one 36-arm file read by two aggregators with two sets of
# rules is exactly how a contrast ends up computed under the wrong one.
#
# WHY THERE IS NO UPSTREAM COLUMN. Upstream `lerobot-annotate` has no fixed-label
# mode at all -- verified five ways against the pinned v0.6.1 install (§5.3):
# `subtasks_path` appears zero times, no config field accepts supplied labels,
# the CLI rejects the flag rather than defaulting to it, and no alignment prompt
# exists. So this grid compares CONFIGURATIONS OF ONE TOOL. Tool-versus-tool is
# Study 1's job, on the generation path the two tools share. `upstream_counterparts:
# false` below says this in machine-readable form: `preflight.check_grid` derives
# an expected `baseline_upstream__<profile>__<camera>` for every arm carrying a
# profile, and no such arm exists here or ever will.
#
# HOW TO AGGREGATE THIS FILE. With `configs/alignment_contrasts.yaml`, never with
# aggregate.py's cell mapping: no baseline can be derived from a cell here, and
# the eight legal contrasts are enumerated in the contrasts file. Nothing else is
# reported as a hypothesis test (§8).
#
# `profile` AND `camera` ARE NOT FREE-FORM LABELS. aggregate.py's D12 gate judges
# equalisation for the PAIR: it diffs the two arms' metadata and flags, maps each
# differing setting to a dimension through `DIMENSION_SETTINGS`, and REFUSES the
# contrast if anything differs that the contrast does not declare as under test.
# `profile` maps to `frame_budget` and `camera` maps to `cameras` there. So
# `profile` varies only with `max_frames_per_prompt` (b60 / b300) and `camera`
# only with the view set (wrist / stack2). An earlier draft of this file used
# descriptive profiles -- sheet300, video300, video300cal -- and every one of them
# would have made contrasts 1, 3 and 4 differ on `frame_budget` while their actual
# budgets were identical, refusing three contrasts including both halves of A3
# for a difference that existed only in the name.
#
#
# ONE DIMENSION AT A TIME, AND THE ARITHMETIC THAT MAKES THAT TRUE
# ----------------------------------------------------------------
# Every arm below carries an identical equalisation block (§7.1: same seed,
# temperature, max_new_tokens, enable_thinking:false, same replica pool,
# interjections and VQA off) and differs from its contrast partner in exactly one
# field. The frame budget is where that claim is easy to get wrong, so it is
# stated explicitly on every arm rather than inherited:
#
#   align_default      contact_sheet   max_frames_per_prompt  60   <- SHIPPED DEFAULT
#   align_sheet_300    contact_sheet   max_frames_per_prompt 300
#   align_video        video           max_frames_per_prompt 300
#   align_video_stack  video           max_frames_per_prompt 300
#
# Contrast 1 (video vs sheet_300) claims to isolate FRAME FORMAT. It only does so
# if both sides see the same frames. Leaving `max_frames_per_prompt` unstated on
# the video arms would let them inherit the shipped 60 and silently confound
# format with budget -- the contrast would measure both and be reported as one.
#
# The budget arithmetic, checked against the real corpus rather than assumed
# (`_align_sample_timestamps`, plan_subtasks_memory.py:2193): alignment is ONE
# call for the whole episode, sampling n = round(duration * frames_per_second) + 1
# timestamps, capped at max_frames_per_prompt // camera_count. Measured over the
# 797 SCORED Corpus A episodes -- the ones carrying ground truth, from
# meta/episodes/*.parquet lengths rather than from span extents -- the episode
# extent is min 26.9s, median 53.6s, max 104.8s. So at fps 2.0
#
#   * the 60-frame cap binds on 793/797 episodes (99.5%): the median episode
#     wants 108 frames and gets 60. That is what makes contrast 5 a real budget
#     contrast rather than a nominal one;
#   * the 300-frame cap binds on 0/797 -- the longest scored episode wants 211.
#
# (Two Corpus A episodes carry no ground truth and are never scored; the longer
# of them runs 236.1s and would hit the 300 cap. It cannot enter a contrast, but
# the arithmetic above is stated for the scored population, not for the repos.)
#
# Contrast 1 is therefore not merely budget-matched in configuration, it is
# frame-identical in fact: align_sheet_300 and align_video sample the very same
# timestamp grid on every episode, and differ only in whether those frames arrive
# as timestamped JPEG grids or as a native clip.
#
# Stacking is budget-neutral by construction on the video path and only there:
# `_align_given_subtasks` sets budget_cameras = 1 when the format is `video`
# (the views are stacked inside each frame, so cost scales with pixels, not with
# timeline length) and len(camera_keys) when it is `contact_sheet` (views are
# separate tiles and share the budget). So align_video and align_video_stack also
# sample identical grids, and contrast 2 isolates the second view alone. A
# stacked CONTACT-SHEET arm would instead have halved its cap to 150, which binds
# on 20.6% of scored episodes -- so it would have been a stacking contrast
# confounded with a budget cut on a fifth of the corpus. That is one reason no
# such arm is in this design.
#
#
# CAMERA CHOICE
# -------------
# Single-camera arms use `observation.images.wrist`; the stacked arms use
# `[wrist, right]`, matching the configuration behind the 83.79% prior result and
# `align_video_realign__*__stack2` in arms.yaml. The single-camera view is one of
# the two in the stack on purpose: contrast 2 then reads as "what does adding the
# second view buy", not as "wrist versus some other pair". All 16 Corpus A
# components expose both keys (verified against every meta/info.json), so no arm
# silently degrades to a different view.
#
# `vlm.camera_key` is set on the stacked arms too. It is the fallback
# `_align_camera_keys` returns if the configured list resolves to nothing, so
# setting it makes the failure mode a single wrist view rather than a
# provider-default view that varies by dataset.
#
#
# EQUALISED: TRUE FOR ALL SIX, INCLUDING THE STACKED ARMS
# ------------------------------------------------------
# In `arms.yaml` `equalised: false` means "upstream reads one camera and has no
# counterpart at this camera set, so this arm supports no tool-versus-tool
# contrast". That meaning does not transfer: there is no upstream arm here at all,
# and `equalised` in this study means what §7.1 says -- every arm receives
# byte-identical settings except in the dimension under test. All six qualify.
#
# This matters because `contrast_policy` refuses any contrast touching an arm
# marked `equalised: false` unless `--allow-unequalised` is passed, and
# `align_video_stack_cal` is the numerator of contrasts 4 and 6. Carrying the
# generation study's marking over would have excluded the primary claims by
# default and invited an override flag -- which is the exact mechanism by which
# the previous study's C4 was forced through a gate and then withdrawn (§1.2).
# Declaring the truth here is the fix; no override is needed and none should be
# used. (This is the config half of defect D12; the aggregate.py half is to scope
# its equalisation gate to the dimension under test.)
#
#
# subtask_align_min_fraction: 0.0 -- A DELIBERATE, RECORDED DEVIATION
# -------------------------------------------------------------------
# Production defaults this to 0.5, and `align_default` is otherwise the shipped
# default verbatim. It is set to 0.0 on every arm, including that one, because
# the shipped value makes the study's own primary metric unmeasurable.
#
# `_check_align_coverage` RAISES `AlignmentCoverageError` when fewer than
# `min_fraction` of the labels are placed. On the fixed-label path that exception
# is not caught anywhere (the only handler, at plan_subtasks_memory.py:1466, is
# on the generated-label realign path), so it aborts the whole CLI invocation --
# which here is one entire (dataset, arm) job. One episode below 50% placement
# would cost all ~40 episodes of that component for that arm, collapsing the
# paired population that every contrast is computed on.
#
# `placed_fraction` is a PRIMARY metric (§6.1: the honest decomposition is B@k
# plus the drop rate itself). An instrument that aborts whenever the quantity it
# measures is low cannot measure it: at 0.5 the metric is censored below 0.5 by
# construction, and the surviving episodes are the easy ones -- precisely the
# conditioning error §2.1(b) identifies in the prior sweep, and precisely the
# abort-policy artefact that Study 1's headline reliability gap turned out to be
# (analysis/failure_investigation.md).
#
# The gate is therefore RECORDED, NOT OBEYED -- the same policy §7.2 already
# adopts for the calibration fitter's `--min-gain` refusal, and for the same
# reason. Its verdict is recovered exactly from the metric: an episode with
# `placed_fraction < 0.5` is one the shipped default would have aborted on, and
# that rate is reported per arm. Nothing is lost except the abort.
#
# Two further benefits: it satisfies §7.5 ("failures are data: an episode that
# produces no spans scores as a failure, it is not dropped"), and it removes the
# §7.2a fit/serve skew for this field entirely -- the offline fitting drivers
# hard-set `subtask_align_min_fraction=0.0` (eval_align.py:143,
# eval_align_batch.py:153; defect D8), so fit and score now agree here rather
# than needing the documented exception.
#
# Stage A gate 5 (§7.4) asks that the value be within [0, 1] -- explicitly NOT
# (0, 1] -- and that the scoring value equal the arm's declared value. Both hold.
# This deviation belongs in analysis/alignment_deviations.md.
#
#
# FLAGS DECLARED THOUGH THEY ARE INERT ON THIS PATH
# -------------------------------------------------
# `subtask_describe_first` and `subtask_seeded_relabel` are skipped in fixed-label
# mode (config.py: there is nothing to ground or relabel). `plan_max_steps`,
# `subtask_generate_frame_format` and `subtask_realign_generated` govern the
# generation path, which must never run here -- Stage A gate 2 asserts that every
# eval episode resolves to a non-empty label list, because `_load_subtasks_file`
# returns [] for an episode absent from an object-keyed file with no `default` and
# `_subtask_spans` then silently GENERATES instead of aligning (defect D3).
#
# They are declared anyway, identically on all six arms and at shipped defaults,
# so that if that assertion is ever wrong the fallthrough is the same on every arm
# instead of being an arm-dependent confound. The contact-sheet geometry flags are
# declared on the video arms for the same reason.
#
# `plan.subtask_import` is the one such flag deliberately NOT declared, and the
# reason is a tool defect worth recording. It is `str = "off"`, mutually exclusive
# with `subtasks_path`, so pinning it to its default would have been free
# insurance -- except that it cannot be expressed on the command line at all.
# draccus parses each CLI value as YAML, and YAML reads a bare `off` as boolean
# false, so `--plan.subtask_import=off` arrives as the string "False" and does not
# round-trip. Quoting it in this file does not help: the quotes are consumed here,
# not there. Omitting the flag leaves the field at its correct default; declaring
# it would have set it to "False", which is not a recognised import source. This
# is why every flag value in this file is round-trip checked against the tool's
# own config class rather than merely checked for a valid field name -- the check
# is what found it.
#
# `subtask_video_fallback: error` makes native video a hard contract. It is inert
# on the contact-sheet arms (it fires only for a stage explicitly configured as
# `video`) and load-bearing on the four video arms: the default is to fall back to
# contact sheets, which would turn contrast 1 into a comparison of an arm against
# itself while every log still read as configured. It is declared on all six.
#
# `uses_video: true` on every arm means "reads the episode's video frames", as it
# does in arms.yaml -- NOT "sends a native video block". That distinction is
# `plan.subtask_align_frame_format`, and it is the whole of contrast 1; do not
# read `uses_video` as the format.
#
#
# PLACEHOLDERS
# ------------
# `run_arm.py` replaces a flag value equal to '{subtasks_path}' with
# `--subtasks-path` and '{calibration_path}' with `--calibration-path`. Both are
# resolved per component by the runner. Every arm consumes a label file (that is
# the study); only the two calibrated arms consume a calibration file.
#
# `calibration_fit_arm` is not read by `run_arm.py`. It names the arm whose
# configuration the calibration file must be fit under, so §7.2a's requirement --
# that the fit and the score come from the SAME configuration, `min_fraction`
# excepted -- is data the runner can act on and preflight can check field by
# field, rather than a paragraph someone has to remember. It is why §9 budgets two
# calibration fits per component and not one: single-view and stacked video are
# different regimes and each calibrated arm needs its own fit.
#
# The cache key must hash the label file's CONTENTS, not its path (defect D1).
# Arms here differ by label file, label files are regenerated routinely, and
# path-keying serves predictions made against the old labels.

study: alignment
upstream_counterparts: false

arms:
- name: align_default
  tool: align
  supervision: labels_only
  uses_video: true
  equalised: true
  profile: b60
  camera: wrist
  base_arm: align_fixed_label
  description: 'THE SHIPPED DEFAULT: fixed-label alignment exactly as a user gets it today without
    reading the handoff -- contact sheets, one camera, no calibration, the default 60-frame budget
    (subtask_align_frame_format defaults to contact_sheet, max_frames_per_prompt to 60, calibration
    to None). The 60-frame cap binds on 99.5% of Corpus A episodes, so this arm sees roughly half
    the frames every other arm sees. Baseline of contrasts 5 and 6; the reference point for claim
    A4, whether the shipped defaults leave a large measurable margin on the table.'
  flags:
    seed: 1729
    vlm.temperature: 0.2
    vlm.max_new_tokens: 4096
    vlm.chat_template_kwargs: '{"enable_thinking":false}'
    vlm.camera_key: observation.images.wrist
    interjections.enabled: false
    vqa.enabled: false
    plan.frames_per_second: 2.0
    plan.min_subtask_seconds: 1.5
    plan.plan_max_steps: 8
    plan.contact_sheet_columns: 5
    plan.contact_sheet_frames_per_sheet: 20
    plan.contact_sheet_frame_width: 224
    plan.contact_sheet_quality: 84
    plan.subtask_describe_first: true
    plan.subtask_seeded_relabel: false
    plan.subtask_generate_frame_format: contact_sheet
    plan.subtask_realign_generated: false
    plan.subtask_video_fallback: error
    plan.subtasks_path: '{subtasks_path}'
    plan.subtask_align_sampling: uniform
    plan.subtask_align_min_fraction: 0.0
    plan.subtask_align_frame_format: contact_sheet
    plan.max_frames_per_prompt: 60
