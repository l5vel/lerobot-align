- name: floor_uniform
  tool: reference
  supervision: labels_only
  uses_video: false
  equalised: true
  source: align_floors.py
  description: Equal segments anchored at the annotated episode start.
- name: floor_median_ratio
  tool: reference
  supervision: labels_plus_seed
  uses_video: false
  equalised: true
  source: align_floors.py
  description: Median relative boundaries from matching-count seeds within the same
    ten-seed task allocation; unsupported counts use uniform timing.
- name: floor_cumulative_prior
  tool: reference
  supervision: labels_plus_seed
  uses_video: false
  equalised: true
  source: align_floors.py
  description: Normalized median segment durations from matching-count seeds within
    the same ten-seed task allocation; unsupported counts use uniform timing.
