  profile: b300
  camera: wrist
  base_arm: align_fixed_label
  calibration_fit_arm: align_video
  description: >-
    align_video with frozen positional calibration from at most ten shared seed
    trajectories per task. The corrected task driver pools wording variants by
    segment count, requires at least three usable seeds per count, and uses the
    identical uncalibrated configuration for unsupported or rejected fits.
    This crosses supervision levels relative to align_video. Runtime events
    establish calibration_applied separately from seed-count eligibility.
    See calibration_protocol.md; historical exact-label results are unchanged.
