    solely in whether those frames arrive as JPEG grids with the time burned in or as a clip whose timestamps
    the model carries natively. Numerator of contrast 1 (A1) and of contrast 8 (does the video help at
    all); baseline of contrasts 2 and 3.
  flags:
    seed: 1729
    vlm.temperature: 0.2
    vlm.max_new_tokens: 4096
    vlm.chat_template_kwargs: '{"enable_thinking":false}'
    vlm.camera_key: observation.images.wrist
    interjections.enabled: false
    vqa.enabled: false
    plan.frames_per_second: 2.0
    plan.min_subtask_seconds: 1.5
    plan.plan_max_steps: 50
    plan.contact_sheet_columns: 5
    plan.contact_sheet_frames_per_sheet: 20
    plan.contact_sheet_frame_width: 224
    plan.contact_sheet_quality: 84
    plan.subtask_describe_first: true
    plan.subtask_seeded_relabel: false
    plan.subtask_generate_frame_format: contact_sheet
    plan.subtask_realign_generated: false
    plan.subtask_video_fallback: error
    plan.subtasks_path: '{subtasks_path}'
    plan.subtask_align_sampling: uniform
    plan.subtask_align_min_fraction: 0.0
    plan.subtask_align_frame_format: video
    plan.max_frames_per_prompt: 300
- name: align_video_stack
  tool: align
  supervision: labels_only
  uses_video: true
  equalised: true
  profile: b300
  camera: stack2
  base_arm: align_fixed_label
  description: 'Native video with the wrist and right views vertically STACKED into each frame, no calibration.
    Identical to align_video in every other field, including the explicit 300-frame budget, which on the
    video path is a per-timestamp budget rather than a per-view one: stacking costs pixels, not timeline.
    So this arm and align_video see the same timestamps and contrast 2 isolates the second view alone
    -- the wrist sees contact, the external view sees approach. Numerator of contrast 2 (A2); baseline
    of contrast 4.'
  flags:
    seed: 1729
    vlm.temperature: 0.2
    vlm.max_new_tokens: 4096
    vlm.chat_template_kwargs: '{"enable_thinking":false}'
    vlm.camera_key: observation.images.wrist
    interjections.enabled: false
    vqa.enabled: false
    plan.frames_per_second: 2.0
    plan.min_subtask_seconds: 1.5
    plan.plan_max_steps: 50
    plan.contact_sheet_columns: 5
    plan.contact_sheet_frames_per_sheet: 20
    plan.contact_sheet_frame_width: 224
    plan.contact_sheet_quality: 84
    plan.subtask_describe_first: true
    plan.subtask_seeded_relabel: false
    plan.subtask_generate_frame_format: contact_sheet
    plan.subtask_realign_generated: false
    plan.subtask_video_fallback: error
    plan.subtasks_path: '{subtasks_path}'
    plan.subtask_align_sampling: uniform
    plan.subtask_align_min_fraction: 0.0
    plan.subtask_align_frame_format: video
    plan.subtask_align_camera_keys: '[observation.images.wrist,observation.images.primary]'
    plan.max_frames_per_prompt: 300
