  uses_video: true
  equalised: true
  profile: b300
  camera: wrist
  base_arm: align_fixed_label
  description: "align_default with the frame budget raised to 300 and nothing else changed. Separates\
    \ \"weak default budget\" from \"weak format\" (\xA75.2): without it, any video-over-sheets win would\
    \ be read as a format effect when it could be a budget effect. Numerator of contrast 5 (budget) and\
    \ baseline of contrast 1 (format, budget held equal). At fps 2.0 the 300-frame cap binds on no scored\
    \ Corpus A episode -- the longest wants 211 -- so this arm samples the full 2 fps grid."
  flags:
    seed: 1729
    vlm.temperature: 0.2
    vlm.max_new_tokens: 4096
    vlm.chat_template_kwargs: '{"enable_thinking":false}'
    vlm.camera_key: observation.images.wrist
    interjections.enabled: false
    vqa.enabled: false
    plan.frames_per_second: 2.0
    plan.min_subtask_seconds: 1.5
    plan.plan_max_steps: 50
    plan.contact_sheet_columns: 5
    plan.contact_sheet_frames_per_sheet: 20
    plan.contact_sheet_frame_width: 224
    plan.contact_sheet_quality: 84
    plan.subtask_describe_first: true
    plan.subtask_seeded_relabel: false
    plan.subtask_generate_frame_format: contact_sheet
    plan.subtask_realign_generated: false
    plan.subtask_video_fallback: error
    plan.subtasks_path: '{subtasks_path}'
    plan.subtask_align_sampling: uniform
    plan.subtask_align_min_fraction: 0.0
    plan.subtask_align_frame_format: contact_sheet
    plan.max_frames_per_prompt: 300
