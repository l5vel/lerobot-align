- name: floor_uniform
  tool: reference
  supervision: labels_only
  uses_video: false
  equalised: true
  source: align_floors.py
  description: "|L| equal parts of the episode, anchored at the EPISODE START and not at t=0. Baseline\
    \ of contrast 8 (claim A5): does looking at the video beat splitting the episode into equal parts?\
    \ The anchor is the whole point -- evaluate_alignment measures every boundary error from ground_truth[0][\"\
    start\"] while reference_arms._equal_split anchors at zero, and where those differ the floor carries\
    \ a constant per-component bias that would read as VLM superiority (\xA75.1). One Corpus A episode\
    \ is affected (u850-bag-place-02-FV-v30 episode 24 starts at 0.563s), which is small, silent, and\
    \ 0.563s against a b_hit@1 tolerance of 1s."
- name: floor_median_ratio
  tool: reference
  supervision: labels_plus_seed
  uses_video: false
  equalised: true
  source: align_floors.py
  description: "Seed set median RELATIVE boundary positions. Produced and scored but referenced by no\
    \ \xA78 contrast, so it is reported descriptively and is not in the Holm family. It is declared here\
    \ anyway because contrast_policy fails closed on an arm with no metadata: without this row the arm\
    \ appears in the per-arm table with its supervision level recorded nowhere, and any future contrast\
    \ naming it would be refused for missing metadata rather than for anything real."
- name: floor_cumulative_prior
  tool: reference
  supervision: labels_plus_seed
  uses_video: false
  equalised: true
  source: align_floors.py
  description: "Seed median SEGMENT LENGTHS, normalised to sum to 1 and accumulated: boundary k at t0\
    \ + D * (sum_{i<k} f_i) / (sum_i f_i). The strongest model-free arm and the baseline of contrast 7\
    \ (claim A5). Deterministic and model-free BY CONSTRUCTION rather than by hope -- \xA75.1 measured\
    \ the obvious \"priors-only DP\" alternative still moving boundaries 0.70s apart with the prior weighted\
    \ 100,000x, because the medians never sum to exactly 1 and the surplus is placeable anywhere at zero\
    \ cost with the model silently deciding where. Stage B gate 11 proves the property by re-running these\
    \ arms against two opposite synthetic model answers and requiring byte-identical output. The corrected\
    \ task protocol uses --prior-scope segment_count: all matching-count examples from the same ten task\
    \ seeds, with at least three usable examples per count. Legacy exact/length modes retain their\
    \ modal exact-label fitting behavior."
