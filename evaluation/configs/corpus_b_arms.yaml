# Corpus B arms -- corpus_b_plan.md section 7.1.
#
# Ported from configs/alignment_arms.yaml so that Corpus A and Corpus B differ in
# CORPUS and nothing else. Every deviation below is forced by the corpus, applies
# to every arm identically, and therefore leaves the contrasts untouched.
#
# 1. CAMERAS. RoboInter ships observation.images.primary and .wrist. Corpus A's
#    stacked arm used [wrist, right]; "right" does not exist here, so the stack
#    becomes [wrist, primary]. Single-camera arms already use wrist, which does.
#
# 2. plan.plan_max_steps: 8 -> 50. Corpus A episodes carry 5-6 subtasks; Corpus B
#    carries 2-38, and 72 of the 1,202 eval trajectories exceed 8. At the Corpus A
#    value those episodes would be truncated, placed_fraction would fall, and the
#    drop would read as a tool failure when it is a configuration ceiling. Raised
#    uniformly across all arms.
#
# NOT changed, and deliberately: fps, max_frames_per_prompt, frame width,
# temperature, sampling, and the frame formats that define the arms. Corpus B's
# video is 320x180 against Corpus A's 640x480 (section 2.7), so the 224px contact
# sheet and the 300-frame budget now sit above the source resolution. Raising them
# would make Corpus B a different experiment rather than the same one on new data.
arms:
- name: align_default
  tool: align
  supervision: labels_only
  uses_video: true
  equalised: true
  profile: b60
  camera: wrist
  base_arm: align_fixed_label
  description: 'THE SHIPPED DEFAULT: fixed-label alignment exactly as a user gets it today without reading
    the handoff -- contact sheets, one camera, no calibration, the default 60-frame budget (subtask_align_frame_format
    defaults to contact_sheet, max_frames_per_prompt to 60, calibration to None). The 60-frame cap binds
    on 99.5% of Corpus A episodes, so this arm sees roughly half the frames every other arm sees. Baseline
    of contrasts 5 and 6; the reference point for claim A4, whether the shipped defaults leave a large
    measurable margin on the table.'
  flags:
    seed: 1729
    vlm.temperature: 0.2
    vlm.max_new_tokens: 4096
    vlm.chat_template_kwargs: '{"enable_thinking":false}'
    vlm.camera_key: observation.images.wrist
    interjections.enabled: false
    vqa.enabled: false
    plan.frames_per_second: 2.0
    plan.min_subtask_seconds: 1.5
    plan.plan_max_steps: 50
    plan.contact_sheet_columns: 5
    plan.contact_sheet_frames_per_sheet: 20
    plan.contact_sheet_frame_width: 224
    plan.contact_sheet_quality: 84
    plan.subtask_describe_first: true
    plan.subtask_seeded_relabel: false
    plan.subtask_generate_frame_format: contact_sheet
    plan.subtask_realign_generated: false
    plan.subtask_video_fallback: error
    plan.subtasks_path: '{subtasks_path}'
    plan.subtask_align_sampling: uniform
    plan.subtask_align_min_fraction: 0.0
    plan.subtask_align_frame_format: contact_sheet
    plan.max_frames_per_prompt: 60
- name: align_sheet_300
