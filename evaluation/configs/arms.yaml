# Experimental arms, as a factorial over configuration profile x camera x tool.
#
# WHY A FACTORIAL. The first version pinned upstream's defaults for equalisation.
# That is fair but has poor external validity: this repo's own run_annotate.sh
# uses fps 3 / budget 300 / 336px / 12 steps, and its published experiments use
# the WRIST camera. At upstream defaults a median 53.6s episode is split into 2
# windows, each independently allowed 8 subtasks, which forces over-segmentation
# (16 permitted vs a human median of 6) on BOTH tools. Measuring only there would
# report an artifact of the equalisation choice as a property of the tools.
#
# So configuration is a REPORTED DIMENSION, not a selected one. Every cell is run
# and every cell is reported; nothing is chosen after seeing scores.
#
# NOTE ON run_annotate.sh, named above and in the `wrap` arm descriptions below.
# It was the maintainer's host-specific annotation wrapper and is deliberately
# not published, so its settings cannot be checked against it from a clone. The
# settings it contributed are the ones stated here and are frozen in each arm's
# own flag list, which is what the harness actually executes; the reference is
# kept because it records where the `wrap` profile's values came from.
#
# MEASURED OUTCOME (added after the sweep; the pre-run text above is left intact).
# The over-segmentation prediction was WRONG, and in the direction that matters.
# Measured log(n_pred / n_true) is about -0.03 at udef -- the right number of
# segments -- and -0.26 to -0.58 at wrap, i.e. the wrap profile emits roughly
# half the segments the humans did. udef also beats wrap on macro IoU in all 12
# tool x camera contrasts (+0.039 to +0.162, p_holm <= 0.009). The inference from
# "the window cap permits 16 subtasks" to "the model will emit 16" was unfounded:
# a cap is not a behaviour. Both profiles are still reported, as promised.
# See analysis/deviations.md D50.
#
# WHY CAMERA IS A DIMENSION. Different robot setups place cameras differently and
# a given view carries different information -- a wrist view sees contact, an
# external view sees navigation. Reporting per-camera is the informative result;
# picking one would bury it.
#
# EQUALISATION still holds where it matters: within a (profile, camera) cell both
# tools receive byte-identical settings, so every contrast is like-for-like. Cells
# are never compared across tools -- only tool-vs-tool within a cell.
#
# THINKING is disabled for every arm (see analysis/deviations.md D47): the model
# is a reasoning model served with --reasoning-parser qwen3, and with thinking on
# it consumed its budget without emitting parseable output. An enable_thinking:true
# comparison is a planned secondary experiment, not part of the primary grid.

arms:
- name: baseline_upstream__udef__left
  tool: upstream
  supervision: none
  uses_video: true
  equalised: true
  profile: udef
  camera: left
  base_arm: baseline_upstream
  description: 'baseline_upstream at upstream defaults verbatim, camera observation.images.left. Equalised
    WITHIN its (profile, camera) cell: the paired arm sees identical settings.'
  flags:
    seed: 1729
    vlm.temperature: 0.2
    vlm.max_new_tokens: 4096
    vlm.chat_template_kwargs: '{"enable_thinking":false}'
    interjections.enabled: false
    vqa.enabled: false
    plan.contact_sheet_columns: 5
    plan.contact_sheet_frames_per_sheet: 20
    plan.contact_sheet_quality: 84
    plan.min_subtask_seconds: 1.5
    plan.subtask_describe_first: true
    plan.subtask_seeded_relabel: false
    plan.frames_per_second: 2.0
    plan.max_frames_per_prompt: 60
    plan.contact_sheet_frame_width: 224
    plan.plan_max_steps: 8
    vlm.camera_key: observation.images.left
